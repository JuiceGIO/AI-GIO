# 升级1：PostgreSQL profile
# 本地联调：--spring.profiles.active=postgres（需先起 PG，或直接 docker compose up -d）
spring.datasource.url=${EXPENSE_DB_URL:jdbc:postgresql://127.0.0.1:5432/expenseai}
spring.datasource.username=${EXPENSE_DB_USER:expenseai}
spring.datasource.password=${EXPENSE_DB_PASSWORD:expenseai}
spring.datasource.driver-class-name=org.postgresql.Driver
# SQLite 单写者限制已解除：连接池按并发压测调整，默认 10
spring.datasource.hikari.maximum-pool-size=${EXPENSE_DB_POOL_MAX:10}
spring.datasource.hikari.minimum-idle=2

# Flyway 启动时自动执行 db/migration 建表/索引脚本
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
