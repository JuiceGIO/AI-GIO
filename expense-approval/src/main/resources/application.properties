spring.application.name=expense-approval
server.port=8080
# 排查用：500 响应直接返回异常信息/堆栈（联调定位问题；上线前可去掉）
server.error.include-message=always
server.error.include-stacktrace=always

# 本地默认 SQLite（升级前行为，start.bat / start_this_pc.bat 直接可用）
# 联调/生产用 PostgreSQL：--spring.profiles.active=postgres（docker-compose 已自动激活）
spring.datasource.url=jdbc:sqlite:${EXPENSE_DB_PATH:D:/ExpenseAI/data/expenseai.db}
spring.datasource.driver-class-name=org.sqlite.JDBC
# SQLite 单写者：连接池必须为 1，避免 "database is locked"
spring.datasource.hikari.maximum-pool-size=1
spring.flyway.enabled=false

# 超时提醒：48 小时未审批视为超时，定时任务每 60 秒扫一次（升级3 后降级为兜底）
expense.reminder.hours=48
expense.reminder.interval-ms=60000
expense.reminder.initial-delay-ms=10000
# 升级3：延迟消息时长（毫秒），与 Python 端 OVERDUE_DELAY_MS 保持一致
expense.reminder.delay-ms=172800000

# 升级3：RabbitMQ（docker-compose 由环境变量覆盖；未启动时自动降级给定时兜底）
spring.rabbitmq.host=${RABBITMQ_HOST:127.0.0.1}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USER:guest}
spring.rabbitmq.password=${RABBITMQ_PASSWORD:guest}
spring.rabbitmq.publisher-confirm-type=correlated
spring.rabbitmq.publisher-returns=true
