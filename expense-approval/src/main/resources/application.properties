spring.application.name=expense-approval
server.port=8080

# 升级1：默认 PostgreSQL（docker-compose 由环境变量覆盖）
# 本机暂未装 PG 时可用 sqlite 兜底：--spring.profiles.active=sqlite
spring.datasource.url=${EXPENSE_DB_URL:jdbc:postgresql://127.0.0.1:5432/expenseai}
spring.datasource.username=${EXPENSE_DB_USER:expenseai}
spring.datasource.password=${EXPENSE_DB_PASSWORD:expenseai}
spring.datasource.driver-class-name=org.postgresql.Driver
# SQLite 单写者限制已解除：连接池按并发压测调整，默认 10
spring.datasource.hikari.maximum-pool-size=${EXPENSE_DB_POOL_MAX:10}
spring.datasource.hikari.minimum-idle=2

# 升级1：Flyway 启动时自动执行 db/migration 建表/索引脚本
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true

# 超时提醒（Day 24）：48 小时未审批视为超时，定时任务每 60 秒扫一次（升级3 后降级为兜底）
expense.reminder.hours=48
expense.reminder.interval-ms=60000
expense.reminder.initial-delay-ms=10000
# 升级3：延迟消息时长（毫秒），与 Python 端 OVERDUE_DELAY_MS 保持一致
expense.reminder.delay-ms=172800000

# 升级3：RabbitMQ（docker-compose 由环境变量覆盖）
spring.rabbitmq.host=${RABBITMQ_HOST:127.0.0.1}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USER:guest}
spring.rabbitmq.password=${RABBITMQ_PASSWORD:guest}
spring.rabbitmq.publisher-confirm-type=correlated
spring.rabbitmq.publisher-returns=true
