spring.application.name=expense-approval
server.port=8080

# SQLite（与 Python 端共用 D:\ExpenseAI\data\expenseai.db）
# 可用环境变量 EXPENSE_DB_PATH 或启动参数 --spring.datasource.url=... 覆盖
spring.datasource.url=jdbc:sqlite:${EXPENSE_DB_PATH:D:/ExpenseAI/data/expenseai.db}
spring.datasource.driver-class-name=org.sqlite.JDBC
# SQLite 单写者：连接池必须为 1，避免 "database is locked"
spring.datasource.hikari.maximum-pool-size=1
