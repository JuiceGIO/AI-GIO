<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8">
  <title>AI 助手（Agent 版）</title>
  <style>
    body { font-family: "Microsoft YaHei", Arial, sans-serif; max-width: 640px; margin: 40px auto; padding: 0 16px; }
    h2 { color: #333; }
    #chat { border: 1px solid #ddd; border-radius: 8px; height: 360px; overflow-y: auto; padding: 12px; margin-bottom: 12px; background: #fafafa; }
    .msg { margin: 8px 0; line-height: 1.5; }
    .user { color: #0366d6; }
    .bot { color: #333; white-space: pre-wrap; }
    #msg { width: calc(100% - 90px); padding: 8px; border: 1px solid #ccc; border-radius: 6px; }
    button { width: 76px; padding: 8px; border: none; border-radius: 6px; background: #0366d6; color: #fff; cursor: pointer; }
  </style>
</head>
<body>
  <h2>企业差旅报销 AI 助手（Agent 版）</h2>
  <div id="chat"></div>
  <input id="msg" placeholder="试试：现在几点？12345 + 67890 等于多少？">
  <button onclick="send()">发送</button>

  <script>
    async function send() {
      const input = document.getElementById('msg');
      const text = input.value.trim();
      if (!text) return;
      addMsg('你', text);
      input.value = '';
      try {
        const res = await fetch('/chat', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ message: text }),
        });
        const data = await res.json();
        addMsg('助手', data.reply);
      } catch (e) {
        addMsg('助手', '请求失败：' + e);
      }
    }

    function addMsg(who, text) {
      const box = document.getElementById('chat');
      const div = document.createElement('div');
      div.className = 'msg ' + (who === '你' ? 'user' : 'bot');
      div.textContent = who + '：' + text;
      box.appendChild(div);
      box.scrollTop = box.scrollHeight;
    }

    document.getElementById('msg').addEventListener('keydown', function (e) {
      if (e.key === 'Enter') send();
    });
  </script>
</body>
</html>
